name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Reject focused tests and conflict markers
        run: bash factory/checks.sh guard
      - run: bun run format:check
      - run: bun run lint:ci
      - name: TypeScript compiler (tsc)
        run: bun run typecheck
      - run: bun run test
      - name: Check whole-project structure and complexity
        run: bun run fallow:ci
